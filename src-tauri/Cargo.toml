[package]
name = "allotrope"
version = "0.1.0"
description = "Convertisseur de fichiers tout-en-un, 100 % local"
authors = ["sAluTcMaNeK"]
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
name = "allotrope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "ico", "gif", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff", "rayon"] }
tauri-plugin-opener = "2"
webp = { version = "0.3.1", default-features = false }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
resvg = "0.48"
# Vectorisation (PNG → SVG), licence MIT ou Apache-2.0
vtracer = "0.6.5"
jxl-oxide = { version = "0.12", features = ["image"] }
lopdf = "0.45"
tauri-plugin-shell = "2"
regex = "1"
rayon = "1"
base64 = "0.23"
zip = { version = "9", default-features = false }
tauri-plugin-single-instance = "2"

# En mode développement, les dépendances (image, webp, oxipng…) sont tout de même optimisées :
# sans cela, compresser une photo prend plusieurs secondes. Notre propre code reste en mode debug.
[profile.dev.package."*"]
opt-level = 3
# Informations de débogage réduites : le dossier `target` reste beaucoup plus petit sur le disque.
# Notre code garde les numéros de ligne (utiles en cas d'erreur) ; les dépendances n'en ont pas besoin.
debug = false

[profile.dev]
debug = "line-tables-only"
